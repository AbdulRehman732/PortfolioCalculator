[build]
  # Netlify doesn't have Flutter installed by default. We must clone it (shallow clone for speed) and then build.
  command = "git clone https://github.com/flutter/flutter.git -b stable --depth 1 && export PATH=\"$PATH:`pwd`/flutter/bin\" && cd psx_app && flutter pub get && flutter build web --release"
  
  # The output directory that Netlify will deploy
  publish = "psx_app/build/web"
  
  # Where Netlify Serverless Functions are located
  functions = "netlify/functions"

[functions]
  # Tell Netlify to use Node for the functions
  node_bundler = "esbuild"
  # Since our function imports from the backend folder, we need to include it
  included_files = ["backend/**"]

# ─── API Redirects ────────────────────────────────────────────────────────────
# Any request starting with /api/ will be routed to our Express app function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# ─── SPA Fallback ─────────────────────────────────────────────────────────────
# Any other request will fall back to index.html (for Flutter Web routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
